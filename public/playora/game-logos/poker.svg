<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Poker</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#29b88a"/><stop offset="1" stop-color="#075348"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#e5eee4"/></linearGradient>
    <linearGradient id="chip" x2="1" y2="1"><stop stop-color="#ffd96d"/><stop offset="1" stop-color="#e39837"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#10372f" flood-opacity=".4"/></filter>
    <filter id="extrude" x="-20%" y="-20%" width="140%" height="160%">
      <feOffset in="SourceAlpha" dy="14" result="d14"/><feFlood flood-color="#10372f" result="c14"/><feComposite in="c14" in2="d14" operator="in" result="s14"/>
      <feOffset in="SourceAlpha" dy="10" result="d10"/><feFlood flood-color="#175448" result="c10"/><feComposite in="c10" in2="d10" operator="in" result="s10"/>
      <feOffset in="SourceAlpha" dy="6" result="d6"/><feFlood flood-color="#3b9875" result="c6"/><feComposite in="c6" in2="d6" operator="in" result="s6"/>
      <feMerge><feMergeNode in="s14"/><feMergeNode in="s10"/><feMergeNode in="s6"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="#143a34"/>
  <rect x="42" y="42" width="428" height="428" rx="100" fill="url(#bg)"/>
  <g filter="url(#extrude)">
  <circle cx="256" cy="241" r="161" fill="#fff" opacity=".06"/>
  <g filter="url(#shadow)">
    <g transform="rotate(-13 200 239)">
      <rect x="118" y="105" width="178" height="253" rx="20" fill="url(#card)" stroke="#23443c" stroke-width="9"/>
      <text x="143" y="169" fill="#ce4850" font-family="Georgia,serif" font-size="54" font-weight="700">A</text>
      <path d="M207 204c-15-21-46-2-2 42 45-40 16-63 2-42zm-1 35-20 27h39z" fill="#ce4850"/>
    </g>
