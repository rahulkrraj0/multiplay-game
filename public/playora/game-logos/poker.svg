      <text x="241" y="169" fill="#1f775d" font-family="Georgia,serif" font-size="54" font-weight="700">K</text>
      <path d="M305 204c-15-21-46-2-2 42 45-40 16-63 2-42zm-1 35-20 27h39z" fill="#1f775d"/>
    </g>
    <circle cx="256" cy="344" r="43" fill="url(#chip)" stroke="#fff1bc" stroke-width="8"/>
    <circle cx="256" cy="344" r="27" fill="none" stroke="#a75b2e" stroke-width="5" stroke-dasharray="8 8"/>
    <path d="M245 344h22m-11-11v22" stroke="#fff9e9" stroke-width="6" stroke-linecap="round"/>
