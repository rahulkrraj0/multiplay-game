name: playora

# Playora on a Linux VPS.
# HTTPS + the redeploy hook ride Cloudflare Tunnel (outbound only).
# TURN is host-networked UDP and is NOT sent through the tunnel.
# Postgres dumps — the full database — are copied to Google Drive by keeper.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keeper:
    build: ./keeper
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      GDRIVE_FOLDER: ${GDRIVE_FOLDER}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${RCLONE_GDRIVE_TOKEN}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/backups/.ready"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  playora:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_PUBLIC_SITE_URL: https://${APP_HOSTNAME}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      BETTER_AUTH_URL: https://${APP_HOSTNAME}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      VITE_PUBLIC_SITE_URL: https://${APP_HOSTNAME}
      TURN_URLS: turn:${TURN_HOST}:3478?transport=udp,turn:${TURN_HOST}:3478?transport=tcp
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_CREDENTIAL: ${TURN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keeper:
        condition: service_healthy
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn:latest
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      TURN_REALM: ${TURN_HOST}
    volumes:
      - ./coturn/start.sh:/start.sh:ro
    entrypoint: ["/bin/sh", "/start.sh"]
    restart: unless-stopped

  redeploy:
    build: ./webhook
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      REPO_DIR: ${HOST_REPO}
      WATCH_BRANCH: main
      PORT: "8787"
    volumes:
      - ${HOST_REPO}:${HOST_REPO}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - playora
      - redeploy
    restart: unless-stopped

volumes:
  pgdata:
  backups:
